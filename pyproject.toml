[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b123d_template_test"
version = "0.1.0"
description = "A test of the build123d CAD project template! Let's hope it all works buttery smooth..."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Cameron Brooks", email = "cbrook49@uwo.ca" },
]
dependencies = [
    "build123d",
    "build123d_ease",
    "ocp_vscode",
    # The PyPI release, not git main. Upstream main tracks an unreleased
    # build123d (>=0.11.2.dev0, which has never been published), so a git
    # install makes the whole dependency set unresolvable.
    "bd_warehouse>=0.3.0",
    "loguru",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "b123d_template_test",
    "b123d_template_test.*",
]

[tool.ruff]
target-version = "py310"
line-length = 79
select = ["E", "F", "I", "C", "Q"]
ignore = [
    "D203",
    "D213",
    "ERA001",
    "S101",
    "RET504",
    "COM812",
    "D100",
    "TD003",
    "FIX002",
]

[tool.isort]
profile = "black"

[tool.pyright]
typeCheckingMode = "basic"

[tool.black]
line-length = 79
